name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_VERSION: v2.12.2

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go.mod / go.sum 정합성
        run: |
          go mod tidy -diff
          go mod verify

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

      - name: 포맷 검사
        run: |
          $(go env GOPATH)/bin/golangci-lint fmt --diff || \
          golangci-lint fmt --diff

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (race + coverage)
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: 커버리지 요약
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 바이너리 빌드
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o /tmp/gostodian ./cmd/gostodian

      - name: 컨테이너 이미지 빌드 (push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gostodian:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
