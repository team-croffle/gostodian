# Fake tokens in redact golden fixtures are intentional test input.
# gitleaks scans full git history, so path allowlist is required.
title = "gostodian"

[allowlist]
description = "synthetic secrets in redact fixtures and the public AWS signature example"
paths = [
  '''(^|/)internal/redact/testdata/''',
  '''(^|/)internal/s3/s3_test\.go''',
]
