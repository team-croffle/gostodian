name: gostodian

services:
  gostodian:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
    image: gostodian:local
    restart: "no"

    # --- 런타임 하드닝 ---
    read_only: true
    user: "65532:65532"          # distroless nonroot
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 128
    mem_limit: 512m

    environment:
      TZ: Asia/Seoul
      GOSTODIAN_CONFIG: /etc/gostodian/config.yaml
      # 시크릿은 값이 아니라 "경로"만 env로 전달한다.
      # env에 값을 넣으면 docker inspect / 크래시 덤프에 그대로 남음.
      GOSTODIAN_SSH_KEY_FILE: /run/secrets/ssh_key
      GOSTODIAN_KNOWN_HOSTS_FILE: /run/secrets/known_hosts
      GOSTODIAN_SECRETS_FILE: /run/secrets/secrets

    volumes:
      - ./config:/etc/gostodian:ro
      # 이력은 이 마운트에만 쓴다. read_only 루트에는 쓰지 않는다.
      # 호스트 logs/는 컨테이너 사용자 65532가 쓸 수 있어야 한다.
      - ./logs:/var/lib/gostodian

    secrets:
      - ssh_key
      - known_hosts
      - secrets

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  ssh_key:
    file: ./secrets/id_ed25519
  known_hosts:
    file: ./secrets/known_hosts
  secrets:
    file: ./secrets/secrets
